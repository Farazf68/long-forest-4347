<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="RadDeck — radiology board review. Flashcards and podcasts for every Core Radiology module, on one spaced-repetition schedule.">
<title>RadDeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F7A72'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F3F5F7;
  --card: #FFFFFF;
  --ink: #16212B;
  --ink-2: #5C6974;
  --ink-3: #8A96A0;
  --line: #DDE3E8;
  --line-strong: #C7D0D7;
  --accent: #1F7A72;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F1EF;
  --again: #B5483C;
  --hard: #A87A1E;
  --good: #1F7A72;
  --easy: #3A74B0;
  --danger: #B5483C;
  --focus: #3A74B0;
  --shadow: 0 1px 2px rgba(22,33,43,.06), 0 8px 24px -12px rgba(22,33,43,.18);
  --r: 10px;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
  --paper: #0F1316;
  --card: #171C20;
  --ink: #E7ECEF;
  --ink-2: #9AA7B1;
  --ink-3: #68757F;
  --line: #262D33;
  --line-strong: #353E46;
  --accent: #4FB3A8;
  --accent-ink: #0F1316;
  --accent-soft: #15302D;
  --again: #D9695C;
  --hard: #D1A044;
  --good: #4FB3A8;
  --easy: #6FA3DC;
  --danger: #D9695C;
  --focus: #6FA3DC;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] { color-scheme: dark;
  --paper: #0F1316;
  --card: #171C20;
  --ink: #E7ECEF;
  --ink-2: #9AA7B1;
  --ink-3: #68757F;
  --line: #262D33;
  --line-strong: #353E46;
  --accent: #4FB3A8;
  --accent-ink: #0F1316;
  --accent-soft: #15302D;
  --again: #D9695C;
  --hard: #D1A044;
  --good: #4FB3A8;
  --easy: #6FA3DC;
  --danger: #D9695C;
  --focus: #6FA3DC;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--font); font-feature-settings: "tnum" 1;
  min-height: 100dvh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.25; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.num { font-feature-settings: "tnum" 1; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 720px; margin: 0 auto; padding: 0 16px; height: 54px;
  display: flex; align-items: center; gap: 4px;
}
.brand { font-weight: 600; font-size: 17px; color: var(--ink); display: inline-flex; align-items: center; gap: 9px; margin-right: 14px; }
.brand:hover { text-decoration: none; }
.brand i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--accent); display: inline-block; }
.nav { display: flex; white-space: nowrap; }
.nav a { padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.nav a:hover { text-decoration: none; color: var(--ink); background: var(--line); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.top .spacer { flex: 1; }
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
.sync:hover { background: var(--line); text-decoration: none; color: var(--ink-2); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync.on i { background: var(--accent); }
.sync.busy i { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- layout ---------- */
main { max-width: 720px; margin: 0 auto; padding: 28px 16px 96px; }
.stack > * + * { margin-top: 28px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
}
.card.pad { padding: 18px 20px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--card); color: var(--ink); font-weight: 500; cursor: pointer;
  text-decoration: none; white-space: nowrap; line-height: 1.3;
}
.btn:hover { text-decoration: none; border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--line); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.lg { padding: 13px 22px; font-size: 16px; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.quiet.on { background: var(--accent-soft); color: var(--accent); }
.btn .k { font-size: 11px; color: inherit; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 1.5; }

/* ---------- lists ---------- */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 13px 16px;
  border-top: 1px solid var(--line); color: inherit; text-decoration: none;
}
.item:first-child { border-top: 0; }
a.item:hover { background: color-mix(in srgb, var(--accent-soft) 60%, var(--card)); text-decoration: none; }
.item .t { flex: 1; min-width: 0; }
.item .t b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-size: 13px; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 10px; align-items: center; }
.item .due { color: var(--accent); font-weight: 600; }
.pod-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--easy); display: inline-block; }
.chev { color: var(--ink-3); }

details.chap { border-top: 1px solid var(--line); }
details.chap:first-of-type { border-top: 0; }
details.chap summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; font-weight: 500; user-select: none;
}
details.chap summary::-webkit-details-marker { display: none; }
details.chap summary .n { color: var(--ink-3); width: 22px; font-weight: 400; }
details.chap summary .meta { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
details.chap summary .arrow { color: var(--ink-3); transition: transform .15s; }
details.chap[open] summary .arrow { transform: rotate(90deg); }
details.chap .mods { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 50%, var(--card)); }
details.chap .mods .item { padding-left: 50px; }

/* ---------- today ---------- */
.lede { font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; max-width: 20ch; }
.empty { padding: 28px 22px; text-align: left; }
.empty p { max-width: 44ch; }

/* ---------- study ---------- */
.study { max-width: 760px; margin: 0 auto; padding: 16px 16px 160px; }
.study-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.scard {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  min-height: 300px; padding: 28px 28px 24px; font-size: 18px; line-height: 1.55;
  overflow-wrap: anywhere;
}
.scard .side + .side { margin-top: 22px; padding-top: 22px; border-top: 1px dashed var(--line-strong); }
.scard img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 8px 0; }
.scard .fld-name { font-size: 12px; color: var(--ink-3); margin: 10px 0 2px; }
.scard .fld:first-child .fld-name { margin-top: 0; }
.scard .extra { margin-top: 14px; color: var(--ink-2); font-size: 16px; }
.scard .cloze { color: var(--accent); font-weight: 600; }
.scard .cloze-gap { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 8px; }
.scard hr { margin: 12px 0; }
.scard table { border-collapse: collapse; } .scard td, .scard th { border: 1px solid var(--line); padding: 4px 8px; }
.scard .tagline { margin-top: 18px; font-size: 12px; color: var(--ink-3); }
.grade-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.grade-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade-in.one { grid-template-columns: 1fr; }
.gbtn {
  border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 10px 6px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2;
}
.gbtn b { font-weight: 600; font-size: 15px; }
.gbtn span { font-size: 12px; color: var(--ink-2); }
.gbtn:hover { border-color: currentColor; }
.gbtn.again { color: var(--again); } .gbtn.hard { color: var(--hard); } .gbtn.good { color: var(--good); } .gbtn.easy { color: var(--easy); }
.gbtn.again b, .gbtn.hard b, .gbtn.good b, .gbtn.easy b { color: inherit; }
.done { text-align: left; padding: 36px 0; }
.done h1 { margin-bottom: 8px; }

/* ---------- module ---------- */
.crumb { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.stats-row { display: flex; gap: 22px; flex-wrap: wrap; }
.stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-2); }
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--card);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .t { flex: 1; min-width: 200px; }
audio { width: 100%; margin-top: 10px; }
.status { font-size: 13px; color: var(--ink-2); }
.status:empty { display: none; }
.status.err { color: var(--danger); }
table.cards { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cards td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.cards tr:first-child td { border-top: 0; }
table.cards td.s { white-space: nowrap; color: var(--ink-2); width: 1%; text-align: right; }
table.cards td.f { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.tile b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
.tile span { font-size: 13px; color: var(--ink-2); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 11px; height: 11px; border-radius: 2px; background: var(--line); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.heat i.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--line)); }
.heat i.l4 { background: var(--accent); }
.bars { display: flex; gap: 6px; align-items: flex-end; height: 90px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-2); height: 100%; justify-content: flex-end; }
.bars i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--ink-2); }
input[type=text], input[type=password], input[type=number], select {
  padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); max-width: 100%;
}
.settings .card.pad + .card.pad { margin-top: 12px; }
.settings .row { gap: 10px; }

/* ---------- misc ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.study-mode .top { display: none; }
@media (max-width: 520px) {
  .brand { margin-right: 4px; font-size: 16px; }
  .nav a { padding: 7px 8px; }
  .sync span { display: none; }
  .sync { padding: 10px; }
  .lede { font-size: 24px; }
  .scard { padding: 22px 18px; font-size: 17px; }
  .card.pad { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><i></i>RadDeck</a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="today">Today</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/stats" data-nav="stats">Stats</a>
    </nav>
    <span class="spacer"></span>
    <a class="sync" id="sync" href="#/settings" title="Sync status"><i></i><span>…</span></a>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-cards" accept=".apkg,.txt,.csv,.tsv,text/plain,text/csv" hidden>
<input type="file" id="file-audio" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav,.opus" hidden>
<input type="file" id="file-backup" accept=".json,application/json" hidden>
<script src="chapters.js"></script>
<script src="fsrs.js"></script>
<script src="zip.js"></script>
<script src="anki.js"></script>
<script src="app.js"></script>
</body>
</html>
